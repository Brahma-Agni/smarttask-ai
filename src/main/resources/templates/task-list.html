<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SmartTask AI - Tasks</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<nav class="navbar navbar-dark bg-primary">
		<div class="container page-container">
			<a class="navbar-brand fw-semibold" th:href="@{/tasks}">SmartTask AI</a>
			<a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a>
		</div>
	</nav>

	<main class="container page-container page-content">
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
			<div>
				<h1 class="page-title mb-1">Tasks</h1>
				<p class="text-secondary mb-0">Create and manage your tasks in one place.</p>
			</div>
			<a class="btn btn-primary" th:href="@{/tasks/new}">Create Task</a>
		</div>

		<div class="card content-card" th:if="${!#lists.isEmpty(tasks)}">
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th scope="col">ID</th>
							<th scope="col">Title</th>
							<th scope="col">Category</th>
							<th scope="col">Priority</th>
							<th scope="col">Status</th>
							<th scope="col">Created At</th>
							<th scope="col">Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="task : ${tasks}">
							<td th:text="${task.id}">1</td>
							<td class="fw-semibold" th:text="${task.title}">Task title</td>
							<td th:text="${#strings.isEmpty(task.category) ? 'Not categorized' : task.category}">Not categorized</td>
							<td>
								<span class="badge"
									  th:classappend="${task.priority == 'HIGH' ? ' text-bg-danger' : (task.priority == 'LOW' ? ' text-bg-secondary' : ' text-bg-warning')}"
									  th:text="${#strings.isEmpty(task.priority) ? 'Not assigned' : task.priority}">Not assigned</span>
							</td>
							<td>
								<span class="badge"
									  th:classappend="${task.status == 'COMPLETED' ? ' text-bg-success' : (task.status == 'NEEDS_ATTENTION' ? ' text-bg-danger' : ' text-bg-primary')}"
									  th:text="${task.status}">OPEN</span>
							</td>
							<td class="text-nowrap" th:text="${task.createdAt}">2026-01-01T10:00</td>
							<td>
								<div class="actions">
									<a class="btn btn-sm btn-outline-primary" th:href="@{/tasks/{id}(id=${task.id})}">View</a>
									<a class="btn btn-sm btn-outline-secondary" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
									<form th:if="${task.status != 'COMPLETED'}" th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post">
										<button class="btn btn-sm btn-outline-success" type="submit">Complete</button>
									</form>
									<form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
										<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="card content-card text-center p-5" th:if="${#lists.isEmpty(tasks)}">
			<h2 class="h5">No tasks yet</h2>
			<p class="text-secondary mb-4">Create your first task to get started.</p>
			<div>
				<a class="btn btn-primary" th:href="@{/tasks/new}">Create Task</a>
			</div>
		</div>
	</main>
</body>
</html>
