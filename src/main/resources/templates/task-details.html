<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SmartTask AI - Task Details</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<nav class="navbar navbar-dark bg-primary">
		<div class="container page-container">
			<a class="navbar-brand fw-semibold" th:href="@{/tasks}">SmartTask AI</a>
		</div>
	</nav>

	<main class="container page-container page-content">
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
			<div>
				<p class="text-secondary mb-1">Task details</p>
				<h1 class="page-title mb-0" th:text="${task.title}">Task title</h1>
			</div>
			<a class="btn btn-outline-secondary" th:href="@{/tasks}">Back to Tasks</a>
		</div>

		<div class="card content-card">
			<div class="card-body p-4">
				<dl class="row detail-list mb-0">
					<dt class="col-sm-3">Title</dt>
					<dd class="col-sm-9" th:text="${task.title}">Task title</dd>

					<dt class="col-sm-3">Description</dt>
					<dd class="col-sm-9 task-description" th:text="${task.description}">Task description</dd>

					<dt class="col-sm-3">Category</dt>
					<dd class="col-sm-9" th:text="${#strings.isEmpty(task.category) ? 'Not categorized' : task.category}">Not categorized</dd>

					<dt class="col-sm-3">Priority</dt>
					<dd class="col-sm-9">
						<span class="badge"
							  th:classappend="${task.priority == 'HIGH' ? ' text-bg-danger' : (task.priority == 'LOW' ? ' text-bg-secondary' : ' text-bg-warning')}"
							  th:text="${#strings.isEmpty(task.priority) ? 'Not assigned' : task.priority}">Not assigned</span>
					</dd>

					<dt class="col-sm-3">AI Summary</dt>
					<dd class="col-sm-9" th:text="${#strings.isEmpty(task.aiSummary) ? 'Not analyzed yet' : task.aiSummary}">Not analyzed yet</dd>

					<dt class="col-sm-3">Status</dt>
					<dd class="col-sm-9">
						<span class="badge"
							  th:classappend="${task.status == 'COMPLETED' ? ' text-bg-success' : (task.status == 'NEEDS_ATTENTION' ? ' text-bg-danger' : ' text-bg-primary')}"
							  th:text="${task.status}">OPEN</span>
					</dd>

					<dt class="col-sm-3">Created At</dt>
					<dd class="col-sm-9" th:text="${task.createdAt}">2026-01-01T10:00</dd>
				</dl>
			</div>
			<div class="card-footer bg-white p-4">
				<div class="actions">
					<a class="btn btn-primary" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
					<form th:if="${task.status != 'COMPLETED'}" th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post">
						<button class="btn btn-success" type="submit">Mark Completed</button>
					</form>
					<form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
						<button class="btn btn-outline-danger" type="submit">Delete</button>
					</form>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
