<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SmartTask AI Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<nav class="navbar navbar-dark bg-primary">
		<div class="container page-container">
			<a class="navbar-brand fw-semibold" th:href="@{/}">SmartTask AI</a>
			<a class="btn btn-outline-light btn-sm" th:href="@{/tasks}">Tasks</a>
		</div>
	</nav>

	<main class="container page-container page-content">
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
			<div>
				<h1 class="page-title mb-1">Dashboard</h1>
				<p class="text-secondary mb-0">A quick overview of your task activity.</p>
			</div>
			<a class="btn btn-primary" th:href="@{/tasks/new}">Create Task</a>
		</div>

		<div class="row row-cols-1 row-cols-sm-2 row-cols-xl-5 g-3">
			<div class="col">
				<div class="card content-card border-start border-primary border-4 h-100">
					<div class="card-body">
						<p class="text-secondary mb-2">Total Tasks</p>
						<p class="display-6 fw-semibold mb-0" th:text="${totalTasks}">0</p>
					</div>
				</div>
			</div>
			<div class="col">
				<div class="card content-card border-start border-info border-4 h-100">
					<div class="card-body">
						<p class="text-secondary mb-2">Open</p>
						<p class="display-6 fw-semibold mb-0" th:text="${openTasks}">0</p>
					</div>
				</div>
			</div>
			<div class="col">
				<div class="card content-card border-start border-warning border-4 h-100">
					<div class="card-body">
						<p class="text-secondary mb-2">High Priority</p>
						<p class="display-6 fw-semibold mb-0" th:text="${highPriorityTasks}">0</p>
					</div>
				</div>
			</div>
			<div class="col">
				<div class="card content-card border-start border-danger border-4 h-100">
					<div class="card-body">
						<p class="text-secondary mb-2">Needs Attention</p>
						<p class="display-6 fw-semibold mb-0" th:text="${needsAttentionTasks}">0</p>
					</div>
				</div>
			</div>
			<div class="col">
				<div class="card content-card border-start border-success border-4 h-100">
					<div class="card-body">
						<p class="text-secondary mb-2">Completed</p>
						<p class="display-6 fw-semibold mb-0" th:text="${completedTasks}">0</p>
					</div>
				</div>
			</div>
		</div>

		<div class="mt-4">
			<a class="btn btn-outline-primary" th:href="@{/tasks}">View All Tasks</a>
		</div>
	</main>
</body>
</html>
