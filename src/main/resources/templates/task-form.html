<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${task.id == null ? 'SmartTask AI - Create Task' : 'SmartTask AI - Edit Task'}">SmartTask AI - Task Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<nav class="navbar navbar-dark bg-primary">
		<div class="container page-container">
			<a class="navbar-brand fw-semibold" th:href="@{/tasks}">SmartTask AI</a>
		</div>
	</nav>

	<main class="container page-container page-content">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<div class="mb-4">
					<h1 class="page-title mb-1" th:text="${task.id == null ? 'Create Task' : 'Edit Task'}">Create Task</h1>
					<p class="text-secondary mb-0">Enter the task details below.</p>
				</div>

				<div class="card content-card">
					<div class="card-body p-4">
						<form th:action="${task.id == null} ? @{/tasks} : @{/tasks/{id}(id=${task.id})}" th:object="${task}" method="post">
							<input th:if="${task.id != null}" type="hidden" th:field="*{category}">
							<input th:if="${task.id != null}" type="hidden" th:field="*{priority}">
							<input th:if="${task.id != null}" type="hidden" th:field="*{status}">
							<input th:if="${task.id != null}" type="hidden" th:field="*{aiSummary}">

							<div class="mb-3">
								<label class="form-label" for="title">Title</label>
								<input class="form-control" id="title" type="text" th:field="*{title}" maxlength="120"
									th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
									placeholder="Enter a clear task title">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
							</div>

							<div class="mb-4">
								<label class="form-label" for="description">Description</label>
								<textarea class="form-control" id="description" th:field="*{description}" rows="6" maxlength="2000"
									th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
									placeholder="Describe what needs to be done"></textarea>
								<div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
							</div>

							<div class="d-flex flex-wrap gap-2">
								<button class="btn btn-primary" type="submit" th:text="${task.id == null ? 'Create Task' : 'Update Task'}">Create Task</button>
								<a class="btn btn-outline-secondary" th:href="@{/tasks}">Cancel</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
